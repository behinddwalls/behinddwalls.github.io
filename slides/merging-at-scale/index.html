<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merging at Scale — Preetam Dwivedi</title>
  <meta name="description" content="Merging at Scale: From Broken Builds to Green Mainline, a presentation by Preetam Dwivedi and Manjari Akella.">
  <link rel="canonical" href="https://behinddwalls.github.io/slides/merging-at-scale/">
  <meta property="og:title" content="Merging at Scale: From Broken Builds to Green Mainline">
  <meta property="og:description" content="A presentation about merge queues, speculative execution, and keeping a large monorepo green.">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://behinddwalls.github.io/slides/merging-at-scale/">
  <meta property="og:image" content="https://behinddwalls.github.io/slides/merging-at-scale/images/conference/slide-01.jpg">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0e0f;
      --panel: #17191b;
      --panel-raised: #222528;
      --ink: #f4f2ed;
      --muted: #aaa9a4;
      --rule: #333639;
      --accent: #f3a1b3;
      --focus: #7cb8ff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    button,
    select,
    input { font: inherit; }

    a { color: inherit; }

    a:focus-visible,
    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .topbar {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 0.8rem 1.25rem;
      min-height: 4.4rem;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--rule);
      background: rgb(23 25 27 / 96%);
      backdrop-filter: blur(12px);
    }

    .identity { min-width: 0; }

    .back {
      display: inline-block;
      margin-bottom: 0.12rem;
      color: var(--muted);
      font-size: 0.78rem;
      text-decoration: none;
    }

    .back:hover { color: var(--ink); }

    h1 {
      margin: 0;
      overflow: hidden;
      font-size: 0.97rem;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .edition {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    select {
      min-width: 9.4rem;
      padding: 0.42rem 1.8rem 0.42rem 0.6rem;
      border: 1px solid var(--rule);
      border-radius: 0.28rem;
      background: var(--panel-raised);
      color: var(--ink);
    }

    .downloads {
      display: flex;
      gap: 0.85rem;
      font-size: 0.82rem;
    }

    .downloads a {
      color: var(--muted);
      text-underline-offset: 0.2em;
    }

    .downloads a:hover { color: var(--ink); }

    .viewer {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1.2rem 4.8rem;
      touch-action: pan-y;
      user-select: none;
    }

    .slide-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      border: 1px solid rgb(255 255 255 / 12%);
      background: #111;
      box-shadow: 0 1.2rem 3.6rem rgb(0 0 0 / 45%);
      object-fit: contain;
      opacity: 1;
      transition: opacity 120ms ease;
    }

    .slide-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .slide-image.is-loading { opacity: 0.48; }

    .side-control {
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      width: 4.2rem;
      border: 0;
      background: transparent;
      color: rgb(255 255 255 / 55%);
      cursor: pointer;
      font-size: 2.5rem;
      transition: color 120ms ease, background 120ms ease;
    }

    .side-control:hover:not(:disabled) {
      background: rgb(255 255 255 / 4%);
      color: white;
    }

    .side-control:disabled {
      cursor: default;
      opacity: 0.18;
    }

    .side-control.prev { left: 0; }
    .side-control.next { right: 0; }

    .controls {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-height: 3.65rem;
      padding: 0.55rem 0.9rem;
      border-top: 1px solid var(--rule);
      background: var(--panel);
    }

    .control-button {
      min-width: 2.4rem;
      min-height: 2.35rem;
      padding: 0.38rem 0.62rem;
      border: 1px solid var(--rule);
      border-radius: 0.28rem;
      background: var(--panel-raised);
      color: var(--ink);
      cursor: pointer;
    }

    .control-button:hover:not(:disabled) { border-color: #666a6e; }

    .control-button:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .page-status {
      display: flex;
      align-items: baseline;
      gap: 0.32rem;
      flex: 0 0 auto;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .page-number {
      width: 3.2rem;
      padding: 0.35rem 0.25rem;
      border: 1px solid var(--rule);
      border-radius: 0.25rem;
      background: var(--bg);
      color: var(--ink);
      text-align: center;
      appearance: textfield;
    }

    .page-number::-webkit-inner-spin-button,
    .page-number::-webkit-outer-spin-button { appearance: none; }

    .scrubber {
      flex: 1 1 auto;
      min-width: 4rem;
      max-width: 34rem;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .controls-spacer { flex: 1 1 auto; }

    .hint {
      color: var(--muted);
      font-size: 0.74rem;
      white-space: nowrap;
    }

    dialog {
      width: min(92vw, 76rem);
      height: min(88vh, 52rem);
      padding: 0;
      overflow: hidden;
      border: 1px solid #4b4e52;
      border-radius: 0.45rem;
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 2rem 6rem rgb(0 0 0 / 70%);
    }

    dialog::backdrop {
      background: rgb(0 0 0 / 72%);
      backdrop-filter: blur(4px);
    }

    .overview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 3.8rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--rule);
    }

    .overview-header h2 {
      margin: 0;
      font-size: 0.95rem;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
      grid-auto-rows: max-content;
      align-content: start;
      gap: 1rem;
      height: calc(100% - 3.8rem);
      padding: 1rem;
      overflow: auto;
    }

    .thumbnail {
      align-self: start;
      padding: 0;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 0.24rem;
      background: #0a0a0a;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
    }

    .thumbnail:hover { border-color: #777b80; }
    .thumbnail.current { border-color: var(--accent); }

    .thumbnail img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .thumbnail span {
      display: block;
      padding: 0.38rem 0.45rem;
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.6rem;
        padding: 0.55rem 0.7rem;
      }

      .edition span { display: none; }

      select {
        min-width: 8.5rem;
        max-width: 42vw;
      }

      .downloads {
        grid-column: 1 / -1;
        padding-top: 0.45rem;
        border-top: 1px solid var(--rule);
      }

      .stage { padding: 0.65rem 2.6rem; }

      .side-control {
        width: 2.5rem;
        font-size: 2rem;
      }

      .controls { gap: 0.25rem; padding-inline: 0.35rem; }
      .hint { display: none; }
      .controls-spacer { display: none; }
      .control-button {
        min-width: 2.2rem;
        padding-inline: 0.42rem;
      }
      .control-button .wide-label { display: none; }
      .page-number { width: 2.4rem; }

      .overview-grid {
        grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
        gap: 0.65rem;
        padding: 0.65rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide-image { transition: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <a class="back" href="../../">← Preetam Dwivedi</a>
      <h1>Merging at Scale: From Broken Builds to Green Mainline</h1>
    </div>
    <label class="edition">
      <span>Talk</span>
      <select id="deckSelect" aria-label="Talk venue">
        <option value="conference">WeAreDevelopers</option>
        <option value="extended">Seattle Systems</option>
      </select>
    </label>
    <nav class="downloads" aria-label="Presentation downloads">
      <a id="videoLink" href="#" target="_blank" rel="noopener">Watch talk</a>
      <a id="pdfLink" href="#" target="_blank" rel="noopener">Open PDF</a>
      <a id="pptxLink" href="#">PowerPoint</a>
    </nav>
  </header>

  <main class="viewer" id="viewer">
    <div class="stage" id="stage">
      <div class="slide-shell">
        <img class="slide-image" id="slideImage" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" width="1440" height="810" alt="Slide 1 of the Merging at Scale presentation">
      </div>
    </div>
    <button class="side-control prev" id="sidePrevious" type="button" aria-label="Previous slide">‹</button>
    <button class="side-control next" id="sideNext" type="button" aria-label="Next slide">›</button>
  </main>

  <footer class="controls">
    <button class="control-button" id="previous" type="button" aria-label="Previous slide">‹</button>
    <div class="page-status">
      <input class="page-number" id="pageNumber" type="number" min="1" value="1" aria-label="Current slide">
      <span>/ <span id="pageCount">47</span></span>
    </div>
    <input class="scrubber" id="scrubber" type="range" min="1" max="47" value="1" aria-label="Choose slide">
    <button class="control-button" id="next" type="button" aria-label="Next slide">›</button>
    <span class="controls-spacer" aria-hidden="true">&nbsp;</span>
    <span class="hint">← → or space to navigate</span>
    <button class="control-button" id="overviewButton" type="button" aria-label="Open slide overview">▦ <span class="wide-label">Overview</span></button>
    <button class="control-button" id="fullscreenButton" type="button" aria-label="Enter fullscreen">⛶ <span class="wide-label">Fullscreen</span></button>
  </footer>

  <dialog id="overviewDialog" aria-labelledby="overviewTitle">
    <div class="overview-header">
      <h2 id="overviewTitle">Slide overview</h2>
      <button class="control-button" id="closeOverview" type="button" aria-label="Close slide overview">Close</button>
    </div>
    <div class="overview-grid" id="overviewGrid"></div>
  </dialog>

  <script>
    const decks = {
      conference: {
        label: "WeAreDevelopers",
        count: 47,
        imageDirectory: "images/conference",
        video: "https://www.youtube.com/watch?v=mPssttsZknY&t=144s",
        pdf: "../%28WAD%29%20Merging%20at%20Scale_%20From%20Broken%20Builds%20to%20Green%20Mainline.pdf",
        pptx: "../%28WAD%29%20Merging%20at%20Scale_%20From%20Broken%20Builds%20to%20Green%20Mainline.pptx"
      },
      extended: {
        label: "Seattle Systems",
        count: 66,
        imageDirectory: "images/extended",
        video: "https://www.youtube.com/watch?v=O4sCvZAMC9w",
        pdf: "../%28v2%29%20Merging%20at%20Scale_%20From%20Broken%20Builds%20to%20Green%20Mainline.pdf",
        pptx: "../Merging%20at%20Scale_%20From%20Broken%20Builds%20to%20Green%20Mainline.pptx"
      }
    };

    const elements = {
      deckSelect: document.querySelector("#deckSelect"),
      videoLink: document.querySelector("#videoLink"),
      pdfLink: document.querySelector("#pdfLink"),
      pptxLink: document.querySelector("#pptxLink"),
      slideImage: document.querySelector("#slideImage"),
      stage: document.querySelector("#stage"),
      previous: document.querySelector("#previous"),
      next: document.querySelector("#next"),
      sidePrevious: document.querySelector("#sidePrevious"),
      sideNext: document.querySelector("#sideNext"),
      pageNumber: document.querySelector("#pageNumber"),
      pageCount: document.querySelector("#pageCount"),
      scrubber: document.querySelector("#scrubber"),
      overviewButton: document.querySelector("#overviewButton"),
      fullscreenButton: document.querySelector("#fullscreenButton"),
      overviewDialog: document.querySelector("#overviewDialog"),
      closeOverview: document.querySelector("#closeOverview"),
      overviewGrid: document.querySelector("#overviewGrid")
    };

    const requestedDeck = new URLSearchParams(window.location.search).get("deck");
    const deckKey = Object.hasOwn(decks, requestedDeck) ? requestedDeck : "conference";
    const deck = decks[deckKey];
    let currentPage = parsePage(window.location.hash.slice(1));
    let overviewBuilt = false;
    let pointerStart = null;

    function parsePage(value) {
      const page = Number.parseInt(value, 10);
      if (!Number.isFinite(page)) return 1;
      return Math.min(Math.max(page, 1), deck.count);
    }

    function imagePath(page) {
      return `${deck.imageDirectory}/slide-${String(page).padStart(2, "0")}.jpg`;
    }

    function updateUrl() {
      window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}#${currentPage}`);
    }

    function updateOverviewSelection() {
      const previousCurrent = elements.overviewGrid.querySelector(".thumbnail.current");
      previousCurrent?.classList.remove("current");
      const current = elements.overviewGrid.querySelector(`[data-page="${currentPage}"]`);
      current?.classList.add("current");
    }

    function preloadNearbySlides() {
      [currentPage - 1, currentPage + 1, currentPage + 2]
        .filter((page) => page >= 1 && page <= deck.count)
        .forEach((page) => {
          const image = new Image();
          image.src = imagePath(page);
        });
    }

    function showPage(page, updateHistory = true) {
      const nextPage = Math.min(Math.max(page, 1), deck.count);
      currentPage = nextPage;
      elements.slideImage.classList.add("is-loading");
      elements.slideImage.src = imagePath(currentPage);
      elements.slideImage.alt = `Slide ${currentPage} of ${deck.count} from Merging at Scale`;
      elements.pageNumber.value = String(currentPage);
      elements.scrubber.value = String(currentPage);
      elements.previous.disabled = currentPage === 1;
      elements.sidePrevious.disabled = currentPage === 1;
      elements.next.disabled = currentPage === deck.count;
      elements.sideNext.disabled = currentPage === deck.count;
      updateOverviewSelection();
      if (updateHistory) updateUrl();
      preloadNearbySlides();
    }

    function buildOverview() {
      const fragment = document.createDocumentFragment();
      for (let page = 1; page <= deck.count; page += 1) {
        const button = document.createElement("button");
        button.className = "thumbnail";
        button.type = "button";
        button.dataset.page = String(page);
        button.setAttribute("aria-label", `Go to slide ${page}`);

        const image = document.createElement("img");
        image.src = imagePath(page);
        image.alt = "";
        image.loading = "lazy";
        image.width = 320;
        image.height = 180;

        const label = document.createElement("span");
        label.textContent = `Slide ${page}`;
        button.append(image, label);
        fragment.append(button);
      }
      elements.overviewGrid.replaceChildren(fragment);
      updateOverviewSelection();
    }

    function openOverview() {
      if (!overviewBuilt) {
        buildOverview();
        overviewBuilt = true;
      }
      elements.overviewDialog.showModal();
      window.requestAnimationFrame(() => {
        elements.overviewGrid.querySelector(".thumbnail.current")?.scrollIntoView({ block: "center" });
      });
    }

    function changeDeck(nextDeckKey) {
      const url = new URL(window.location.href);
      if (nextDeckKey === "conference") {
        url.searchParams.delete("deck");
      } else {
        url.searchParams.set("deck", nextDeckKey);
      }
      url.hash = "1";
      window.location.assign(url);
    }

    elements.deckSelect.value = deckKey;
    elements.pageCount.textContent = String(deck.count);
    elements.pageNumber.max = String(deck.count);
    elements.scrubber.max = String(deck.count);
    elements.videoLink.href = deck.video;
    elements.pdfLink.href = deck.pdf;
    elements.pptxLink.href = deck.pptx;
    elements.slideImage.addEventListener("load", () => elements.slideImage.classList.remove("is-loading"));
    elements.slideImage.addEventListener("error", () => elements.slideImage.classList.remove("is-loading"));

    elements.previous.addEventListener("click", () => showPage(currentPage - 1));
    elements.sidePrevious.addEventListener("click", () => showPage(currentPage - 1));
    elements.next.addEventListener("click", () => showPage(currentPage + 1));
    elements.sideNext.addEventListener("click", () => showPage(currentPage + 1));
    elements.scrubber.addEventListener("input", (event) => showPage(Number(event.target.value)));
    elements.pageNumber.addEventListener("change", (event) => showPage(Number(event.target.value)));
    elements.pageNumber.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        showPage(Number(event.currentTarget.value));
        event.currentTarget.blur();
      }
    });
    elements.deckSelect.addEventListener("change", (event) => changeDeck(event.target.value));
    elements.overviewButton.addEventListener("click", openOverview);
    elements.closeOverview.addEventListener("click", () => elements.overviewDialog.close());
    elements.overviewGrid.addEventListener("click", (event) => {
      const thumbnail = event.target.closest(".thumbnail");
      if (!thumbnail) return;
      showPage(Number(thumbnail.dataset.page));
      elements.overviewDialog.close();
    });

    elements.fullscreenButton.addEventListener("click", async () => {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        await document.documentElement.requestFullscreen();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      const active = Boolean(document.fullscreenElement);
      elements.fullscreenButton.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
      elements.fullscreenButton.querySelector(".wide-label").textContent = active ? "Exit fullscreen" : "Fullscreen";
    });

    window.addEventListener("hashchange", () => showPage(parsePage(window.location.hash.slice(1)), false));
    window.addEventListener("keydown", (event) => {
      if (elements.overviewDialog.open) return;
      if (["INPUT", "SELECT"].includes(document.activeElement?.tagName)) return;

      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        showPage(currentPage + 1);
      } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
        event.preventDefault();
        showPage(currentPage - 1);
      } else if (event.key === "Home") {
        event.preventDefault();
        showPage(1);
      } else if (event.key === "End") {
        event.preventDefault();
        showPage(deck.count);
      } else if (event.key.toLowerCase() === "o") {
        event.preventDefault();
        openOverview();
      } else if (event.key.toLowerCase() === "f") {
        event.preventDefault();
        elements.fullscreenButton.click();
      }
    });

    elements.stage.addEventListener("pointerdown", (event) => {
      pointerStart = { x: event.clientX, y: event.clientY, time: Date.now() };
    });

    elements.stage.addEventListener("pointerup", (event) => {
      if (!pointerStart) return;
      const deltaX = event.clientX - pointerStart.x;
      const deltaY = event.clientY - pointerStart.y;
      const elapsed = Date.now() - pointerStart.time;
      pointerStart = null;
      if (elapsed > 700 || Math.abs(deltaX) < 45 || Math.abs(deltaX) < Math.abs(deltaY)) return;
      showPage(currentPage + (deltaX < 0 ? 1 : -1));
    });

    showPage(currentPage);
  </script>
</body>
</html>
